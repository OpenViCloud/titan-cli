name: CI

# Build, vet, unit tests, and the generated client matching the committed copy of the API contract
# (api/openapi-v1.json, synced from OpenViCloud/titan-control-plane by scripts/sync-spec.sh).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generated client matches the spec
        run: |
          go generate ./api/
          git diff --exit-code -- api/

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The release build without publishing or signing: a broken .goreleaser.yaml fails here, not on a tag.
      - name: Release build (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign
